# FA Agent 全局风控红线配置
# 
# ⚠️ 重要说明:
# - 此文件是所有Agent的唯一风控真相源
# - 所有Agent只读，运行时不可覆盖
# - 修改需L2双人审批 + 版本记录
# - 每次修改必须更新版本号和变更日志
#
# 版本: v1.0
# 更新日期: 2026-08-03
# 审批人: [待填写]

version: "1.0"
updated_at: "2026-08-03"

# ============================================================
# 1. 全局风控
# ============================================================
global:
  # 最大回撤红线
  max_drawdown_line: 0.08
  
  # 最大杠杆
  max_leverage: 2.0
  
  # 水位线机制 (净值触发)
  water_levels:
    - nav: 0.95
      leverage: 1.5
      action: REDUCE_LEVERAGE
      alert_severity: WARNING
      
    - nav: 0.90
      leverage: 1.0
      action: REDUCE_LEVERAGE
      alert_severity: CRITICAL
      
    - nav: 0.85
      leverage: 0.5
      action: HALT
      alert_severity: EMERGENCY
      
    - nav: 0.80
      leverage: 0.0
      action: FORCE_LIQUIDATE
      alert_severity: EMERGENCY

# ============================================================
# 2. 单因子风控
# ============================================================
single_factor:
  # 单因子最大亏损贡献
  max_loss_pct: 0.02
  
  # 因子最大暴露
  max_exposure: 0.5
  
  # 因子衰减检测阈值 (IC下降)
  decay_threshold: 0.03

# ============================================================
# 3. 行业风控
# ============================================================
industry:
  # 单一行业最大权重
  max_concentration: 0.15
  
  # 特定行业限制 (可选)
  specific_limits:
    # 高波动行业更严格
    # 证券: 0.10
    # 有色: 0.10

# ============================================================
# 4. 单票风控
# ============================================================
single_stock:
  # 单票最大权重
  max_weight: 0.05
  
  # 单票最小权重 (避免碎片化)
  min_weight: 0.001
  
  # 最小流动性要求 (日均成交额, 万元)
  min_daily_turnover: 1000
  
  # 流动性天数要求
  min_liquidity_days: 5
  
  # ST股票禁止
  allow_st: false
  
  # 上市不满N天禁止
  min_listing_days: 60

# ============================================================
# 5. 期权风控 (如适用)
# ============================================================
options:
  # 单品种最大持仓 (张)
  single_symbol_position: 9000  # 印度10000张限制留buffer
  
  # Vega分桶限制
  vega_bucket:
    near_month: 50000
    far_month: 30000
    
  # Delta中性偏离
  max_delta_deviation: 0.1
  
  # Gamma风险限制
  max_gamma_exposure: 10000

# ============================================================
# 6. 执行风控
# ============================================================
execution:
  # 每日撤单限制 (国内)
  daily_cancel_limit: 450
  
  # 撤单预警线
  cancel_warning_threshold: 400
  
  # 最大滑点容忍
  max_slippage: 0.005
  
  # 单笔最大交易额 (万元)
  max_single_trade_amount: 500
  
  # 执行偏离预警 (实盘vs回测)
  execution_drift_threshold: 0.02

# ============================================================
# 7. 研究完整性红线 (防造假)
# ============================================================
research_integrity:
  # 最小样本外夏普
  min_oos_sharpe: 1.0
  
  # 样本外/样本内夏普比值下限
  min_oos_is_ratio: 0.6
  
  # 最大过拟合概率
  max_pbo: 0.5
  
  # 最小IC信息比率
  min_ic_ir: 0.3
  
  # 因子最大相关性 (去冗余)
  max_factor_correlation: 0.7
  
  # 强制要求经济学逻辑
  require_economic_logic: true
  
  # 最小回测周期 (年)
  min_backtest_years: 3
  
  # 最小样本外周期 (月)
  min_oos_months: 6

# ============================================================
# 8. 模型风控
# ============================================================
model:
  # 特征重要性集中度上限 (单特征)
  max_feature_importance: 0.5
  
  # 最少特征数
  min_features: 3
  
  # 模型过期时间 (天)
  model_expiry_days: 90

# ============================================================
# 9. 组合约束
# ============================================================
portfolio:
  # 最大换手率 (每期)
  max_turnover: 0.3
  
  # 最少持仓数
  min_holdings: 20
  
  # 最多持仓数
  max_holdings: 100
  
  # 现金最小比例
  min_cash_ratio: 0.02

# ============================================================
# 10. 市场异常处置
# ============================================================
market_anomaly:
  # 市场熔断处置
  circuit_breaker:
    action: PAUSE_TRADING
    
  # 单日跌幅超限
  daily_drop_threshold: -0.07
  daily_drop_action: REDUCE_POSITION
  
  # 波动率飙升
  volatility_spike_threshold: 2.0  # 相对历史的倍数
  volatility_spike_action: REDUCE_LEVERAGE

# ============================================================
# 变更日志
# ============================================================
changelog:
  - version: "1.0"
    date: "2026-08-03"
    changes:
      - "初始版本创建"
    approvers: []
